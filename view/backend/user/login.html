
<!DOCTYPE html>
<html class="h-100" lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Quixlab - Bootstrap Admin Dashboard Template by Themefisher.com</title>
    <!-- Favicon icon -->
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/images/favicon.png">
    <!-- <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css" integrity="sha384-B4dIYHKNBt8Bc12p+WXckhzcICo0wtJAoU8YZTY5qE0Id1GSseTk6S+L3BlXeVIU" crossorigin="anonymous"> -->
    <link href="../css/style.css" rel="stylesheet">
    
</head>

<body class="h-100">
    
    <!--*******************
        Preloader start
    ********************-->
    <div id="preloader">
        <div class="loader">
            <svg class="circular" viewBox="25 25 50 50">
                <circle class="path" cx="50" cy="50" r="20" fill="none" stroke-width="3" stroke-miterlimit="10" />
            </svg>
        </div>
    </div>
    <!--*******************
        Preloader end
    ********************-->

    



    <div class="login-form-bg h-100">
        <div class="container h-100">
            <div class="row justify-content-center h-100">
                <div class="col-xl-6">
                    <div class="form-input-content">
                        <div class="card login-form mb-0">
                            <div class="card-body pt-5">
                                <a class="text-center" href="index.html"> <h4>登 录</h4></a>
        
                                <form class="mt-5 mb-5 login-input" id="loginForm">
                                    <div class="form-group">
                                        <input type="text" class="form-control" id="loginUsername" name="username" placeholder="用户名" autocomplete="username">
                                    </div>
                                    <div class="form-group">
                                        <input type="password" class="form-control" id="loginPassword" name="password" placeholder="密码" autocomplete="current-password">
                                    </div>
                                    <div id="loginMsg" class="text-danger mb-2" style="min-height:20px;"></div>
                                    <button type="button" class="btn login-form__btn submit w-100" id="loginBtn" onclick="doLogin()">登 录</button>
                                </form>
                                <p class="mt-5 login-form__footer">还没有账号？<a href="register.html" class="text-primary">立即注册</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    

    

    <!--**********************************
        Scripts
    ***********************************-->
    <script src="../plugins/common/common.min.js"></script>
    <script src="../js/custom.min.js"></script>
    <script src="../js/settings.js"></script>
    <script src="../js/gleek.js"></script>
    <script src="../js/styleSwitcher.js"></script>

    <script>
        // 登录提交：调用 /backend/user/login，成功后存 token/role 并跳转
        function doLogin() {
            var username = $('#loginUsername').val().trim();
            var password = $('#loginPassword').val();
            if (!username || !password) {
                $('#loginMsg').text('请输入用户名和密码');
                return;
            }
            $('#loginMsg').text('');
            $('#loginBtn').prop('disabled', true).text('登录中...');

            $.post('/backend/user/login', { username: username, password: password }, function (res) {
                if (res.code === 0) {
                    // 保存登录态（token + 角色，供侧边栏 RBAC 菜单接口使用）
                    localStorage.setItem('loginToken', res.data.token);
                    localStorage.setItem('loginRole', res.data.user.role || 'user');
                    localStorage.setItem('loginUser', res.data.user.nickname || res.data.user.username);
                    localStorage.setItem('loginUsername', res.data.user.username || username);
                    // 跳转到后台首页
                    window.location.href = '/view/backend/goods/list.html';
                } else {
                    $('#loginBtn').prop('disabled', false).text('登 录');
                    $('#loginMsg').text(res.msg || '登录失败');
                }
            }, 'json').fail(function () {
                $('#loginBtn').prop('disabled', false).text('登 录');
                $('#loginMsg').text('登录请求失败，请检查网络或接口');
            });
        }

        // 回车提交
        $(function () {
            $('#loginPassword').on('keydown', function (e) {
                if (e.key === 'Enter') { doLogin(); }
            });
            $('#loginUsername').on('keydown', function (e) {
                if (e.key === 'Enter') { doLogin(); }
            });
        });
    </script>
</body>
</html>
