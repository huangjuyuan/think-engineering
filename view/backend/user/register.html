<!DOCTYPE html>
<html class="h-100" lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Quixlab - Bootstrap Admin Dashboard Template by Themefisher.com</title>
    <!-- Favicon icon -->
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/images/favicon.png">
    <link href="../css/style.css" rel="stylesheet">

</head>

<body class="h-100">

    <!--*******************
        Preloader start
    ********************-->
    <div id="preloader">
        <div class="loader">
            <svg class="circular" viewBox="25 25 50 50">
                <circle class="path" cx="50" cy="50" r="20" fill="none" stroke-width="3" stroke-miterlimit="10" />
            </svg>
        </div>
    </div>
    <!--*******************
        Preloader end
    ********************-->

    <div class="login-form-bg h-100">
        <div class="container h-100">
            <div class="row justify-content-center h-100">
                <div class="col-xl-6">
                    <div class="form-input-content">
                        <div class="card login-form mb-0">
                            <div class="card-body pt-5">
                                <a class="text-center" href="index.html"> <h4>Rosella</h4></a>

                                <form class="mt-5 mb-5 login-input">
                                    <div class="form-group">
                                        <input type="text" class="form-control" id="regUsername" placeholder="用户名">
                                    </div>
                                    <div class="form-group">
                                        <input type="text" class="form-control" id="regNickname" placeholder="昵称">
                                    </div>
                                    <div class="form-group">
                                        <input type="password" class="form-control" id="regPassword" placeholder="密码">
                                    </div>
                                    <div class="form-group">
                                        <input type="email" class="form-control" id="regEmail" placeholder="邮箱（可选）">
                                    </div>
                                    <div id="registerMsg" class="text-danger mb-2" style="min-height:20px;font-size:13px;"></div>
                                    <button type="button" class="btn login-form__btn submit w-100" onclick="submitRegister()">Sign Up</button>
                                </form>
                                <p class="mt-5 login-form__footer">已有账号？<a href="login.html" class="text-primary">立即登录</a></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>



    <!--**********************************
        Scripts
    ***********************************-->
    <script src="../plugins/common/common.min.js"></script>
    <script src="../js/custom.min.js"></script>
    <script src="../js/settings.js"></script>
    <script src="../js/gleek.js"></script>
    <script src="../js/styleSwitcher.js"></script>

    <!-- 注册逻辑（请求假接口 /backend/user/register） -->
    <script>
        function submitRegister() {
            var username = $('#regUsername').val();
            var nickname = $('#regNickname').val();
            var password = $('#regPassword').val();
            var email    = $('#regEmail').val();

            if (!username || !nickname || !password) {
                $('#registerMsg').text('用户名、昵称、密码不能为空');
                return;
            }
            $('#registerMsg').text('');

            $.post('/backend/user/register', {
                username: username,
                nickname: nickname,
                password: password,
                email: email
            }, function (res) {
                if (res.code === 0) {
                    // 注册成功：保存登录态（token + 角色）并直接进入后台，无需再次登录
                    localStorage.setItem('loginToken', res.data.token);
                    localStorage.setItem('loginRole', res.data.user.role || 'user');
                    localStorage.setItem('loginUser', res.data.user.nickname || res.data.user.username);
                    $('#registerMsg').removeClass('text-danger').addClass('text-success').text(res.msg + '，正在进入后台…');
                    setTimeout(function () { window.location.href = '/view/backend/goods/list.html'; }, 1200);
                } else {
                    $('#registerMsg').text(res.msg || '注册失败');
                }
            }, 'json').fail(function () {
                $('#registerMsg').text('请求失败，请检查接口地址');
            });
        }
    </script>
</body>
</html>
